# Matuwall configuration
# Place this file at $XDG_CONFIG_HOME/matuwall/config.toml
# (or ~/.config/matuwall/config.toml). Every key is optional and the values
# below are the defaults. A missing file runs with these same defaults

[general]
# Directory scanned for wallpapers. A leading ~ expands to $HOME.
directory = "~/Pictures/Wallpapers"

# Wallpaper daemon used to apply the selection: "sweetbg", "awww", or "auto"
# "auto" probes sweetbg then awww and picks the first one actually running
backend = "awww"

# Extra flags for each backend's img command, one argument per item
# https://github.com/naurissteins/Matuwall/wiki/Backends-and-Hooks#backend-flags
[backend.sweetbg]
# --persist (-p) keeps the wallpaper after a sweetbg restart
args = []
# args = ["--persist"]

[backend.awww]
args = []
# args = ["--transition-type", "grow", "--transition-duration", "1.5"]

[window]
# Show the selected wallpaper full-screen behind the grid
preview = false

# Close when keyboard focus moves away from Matuwall
close_on_focus_loss = false

# Placement on screen: "center", "left", "right", "top" or "bottom"
position = "bottom"

# Panel color as "#rrggbb" (opaque) or "#rrggbbaa" (with alpha)
background = "#11111b"

# Gap in pixels between the tiles and the panel edge
margin = 34

# Gap in pixels between an edge positioned panel and monitor edge
edge_margin = 24

# Panel corner radius in pixels
radius = 40

[input]
# Enable hover selection, wheel navigation and left-click apply
mouse = false

[animation]
# Duration of navigation transitions in milliseconds. Set to zero to disable
navigation_ms = 410

# Selected thumbnail enlargement in percent. Set to zero to disable it
zoom_percent = 10

[grid]
# Maximum number of tile columns. Fewer are used on narrow outputs
columns = 5

# Gap in pixels between tiles
spacing = 16

# Tile corner radius in pixels
radius = 20

# Thumbnail border width in pixels. Set to zero to disable the border
border_width = 0

# Soft shadow width outside thumbnail edges. Set to zero to disable the shadow
shadow_width = 12

# Selection ring width in pixels. Set to zero to disable the ring
ring_width = 0

# Maximum rows kept visible. Fewer are used on short outputs
visible_rows = 1

# Turn the grid into a centered carousel. Top, bottom, and center use a
# horizontal row, left and right use a vertical column. In this mode columns
# controls the maximum visible tiles and visible_rows is ignored
carousel = true

# What carousel tiles do at the panel edges. "clip" cuts them at the margin,
# "peek" lets them extend into it and "fade" shrinks and fades them out.
# "auto" fades when the background is fully transparent and clips otherwise
# The regular grid treats "fade" as "clip"
edge = "auto"

[thumbnail]
# Thumbnail size in pixels
width = 300
height = 169

[colors]
# Placeholder tile shown until a thumbnail is ready
tile = "#313244ff"

# Border drawn inside every thumbnail
border = "#585b70ff"

# Shadow fading outward from thumbnail edges
shadow = "#00000066"

# Selection ring around the focused tile
ring = "#f2cdcdff"

# Loading dot pulsing on tiles that are still decoding
spinner = "#cdd0e6ff"

[hooks]
# Commands run after the wallpaper is applied, e.g. to regenerate a colorscheme
# More info: https://github.com/naurissteins/Matuwall/wiki/Backends-and-Hooks#hooks
# on_apply = [
#   "matugen image {path} --source-color-index 1",
#   "wal -i {path} -n",
# ]
